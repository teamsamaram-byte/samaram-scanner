<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAMARAM '26 — Entry Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #f5f0e8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 6px;
      margin-bottom: 25px;
      color: #aaa;
      font-size: 14px;
      letter-spacing: 1px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    #status {
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #222;
      font-size: 20px;
      font-weight: bold;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #details {
      margin-top: 12px;
      font-size: 17px;
      line-height: 1.6;
      color: #ddd;
    }

    button {
      margin-top: 22px;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #f28c28;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .valid {
      background: #164d2a !important;
      color: #7dff9e;
    }

    .used {
      background: #541b1b !important;
      color: #ff7777;
    }

    .invalid {
      background: #4b3b16 !important;
      color: #ffd36b;
    }

    .error {
      background: #541b1b !important;
      color: #ff7777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SAMARAM '26</h1>

  <div class="subtitle">
    ENTRY VERIFICATION
  </div>

  <div id="reader"></div>

  <div id="status">
    Starting scanner...
  </div>

  <div id="details"></div>

  <button
    id="scanAgain"
    class="hidden"
    onclick="startScanner()">
    SCAN NEXT PASS
  </button>

</div>


<script>

  // =========================================================
  // APPS SCRIPT BACKEND
  // =========================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbz8Kw4J5VjVtzSyWPr5LdzMobzdncJ_7u5h50QGv8Y3VfLA46I0rviNzqy0XcFcVsyU/exec";


  // =========================================================
  // VARIABLES
  // =========================================================

  let scanner = null;
  let scanLocked = false;
  let requestTimer = null;


  // =========================================================
  // STATUS
  // =========================================================

  function setStatus(message, type = "") {

    const status =
      document.getElementById("status");

    status.className = "";

    if (type) {
      status.classList.add(type);
    }

    status.textContent = message;
  }


  // =========================================================
  // START SCANNER
  // =========================================================

  async function startScanner() {

    scanLocked = false;

    const details =
      document.getElementById("details");

    const button =
      document.getElementById("scanAgain");

    details.innerHTML = "";

    button.classList.add("hidden");

    setStatus("Starting camera...");


    // Clear previous scanner

    if (scanner) {

      try {
        await scanner.clear();
      } catch (e) {}

    }


    scanner =
      new Html5Qrcode("reader");


    try {

      await scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true
        },

        function(decodedText) {

          if (scanLocked) {
            return;
          }

          scanLocked = true;

          verifyQRCode(decodedText);

        },

        function(errorMessage) {
          // Normal QR scanning errors are ignored
        }

      );

      setStatus("SCAN PASS");

    }

    catch (error) {

      console.error(
        "Camera error:",
        error
      );

      setStatus(
        "CAMERA ERROR",
        "error"
      );

      details.innerHTML =
        "Camera could not be started.";

      button.classList.remove("hidden");

    }

  }


  // =========================================================
  // VERIFY QR
  // =========================================================

  async function verifyQRCode(decodedText) {

    setStatus("Checking pass...");

    const details =
      document.getElementById("details");

    details.innerHTML = "";


    // Clean scanned value

    const passID =
      decodedText.trim();


    console.log(
      "QR scanned:",
      passID
    );


    // Stop scanner

    if (scanner) {

      try {
        await scanner.stop();
      }

      catch (e) {
        console.log(
          "Scanner stop:",
          e
        );
      }

    }


    // =======================================================
    // UNIQUE CALLBACK
    // =======================================================

    const callbackName =
      "samaramCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 10000);


    let finished = false;


    // =======================================================
    // CLEANUP
    // =======================================================

    function cleanup() {

      if (requestTimer) {

        clearTimeout(
          requestTimer
        );

        requestTimer = null;

      }

      const oldScript =
        document.getElementById(
          "samaram-api-request"
        );

      if (oldScript) {
        oldScript.remove();
      }


      try {
        delete window[callbackName];
      }

      catch (e) {

        window[callbackName] =
          undefined;

      }

    }


    // =======================================================
    // CALLBACK
    // =======================================================

    window[callbackName] =
      function(result) {

        if (finished) {
          return;
        }

        finished = true;

        console.log(
          "Backend response:",
          result
        );

        cleanup();

        handleVerificationResult(
          result
        );

      };


    // =======================================================
    // SCRIPT REQUEST
    // =======================================================

    const script =
      document.createElement("script");


    script.id =
      "samaram-api-request";


    // Cache-busting parameter

    const cacheBust =
      Date.now();


    script.src =
      API_URL +
      "?passID=" +
      encodeURIComponent(passID) +
      "&callback=" +
      encodeURIComponent(callbackName) +
      "&t=" +
      cacheBust;


    script.async = true;


    // =======================================================
    // NETWORK ERROR
    // =======================================================

    script.onerror =
      function() {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        console.error(
          "Apps Script request failed."
        );

        setStatus(
          "CONNECTION ERROR",
          "error"
        );

        details.innerHTML =
          "Could not receive a response from the ticket database.<br><br>" +
          "The pass may have already been processed. " +
          "Check the sheet before scanning it again.";

        document
          .getElementById("scanAgain")
          .classList.remove("hidden");

      };


    document.body.appendChild(
      script
    );


    // =======================================================
    // TIMEOUT
    // =======================================================

    requestTimer =
      setTimeout(
        function() {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          console.error(
            "Apps Script request timed out."
          );

          setStatus(
            "SERVER TIMEOUT",
            "error"
          );

          details.innerHTML =
            "The ticket database took too long to respond.<br><br>" +
            "Check the sheet before scanning this pass again.";

          document
            .getElementById("scanAgain")
            .classList.remove("hidden");

        },

        15000
      );

  }


  // =========================================================
  // HANDLE BACKEND RESULT
  // =========================================================

  function handleVerificationResult(result) {

    const details =
      document.getElementById("details");

    const button =
      document.getElementById("scanAgain");


    // =======================================================
    // VALID
    // =======================================================

    if (
      result &&
      result.status === "VALID"
    ) {

      setStatus(
        "✓ ENTRY ALLOWED",
        "valid"
      );


      details.innerHTML =
        "<strong>Name:</strong> " +
        escapeHtml(
          result.name ||
          "Unknown"
        ) +
        "<br>" +

        "<strong>Roll No:</strong> " +
        escapeHtml(
          result.rollNumber ||
          "Unknown"
        );


      button.classList.remove(
        "hidden"
      );

      return;

    }


    // =======================================================
    // USED
    // =======================================================

    if (
      result &&
      result.status === "USED"
    ) {

      setStatus(
        "✕ ALREADY USED",
        "used"
      );


      details.innerHTML =
        escapeHtml(
          result.message ||
          "This pass has already been used."
        );


      button.classList.remove(
        "hidden"
      );

      return;

    }


    // =======================================================
    // INVALID
    // =======================================================

    setStatus(
      "✕ INVALID PASS",
      "invalid"
    );


    details.innerHTML =
      escapeHtml(
        result &&
        result.message
          ? result.message
          : "This pass is not valid."
      );


    button.classList.remove(
      "hidden"
    );

  }


  // =========================================================
  // ESCAPE HTML
  // =========================================================

  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  // =========================================================
  // START
  // =========================================================

  window.onload =
    function() {

      startScanner();

    };

</script>

</body>
</html>
