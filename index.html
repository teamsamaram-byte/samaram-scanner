<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAMARAM '26 — Entry Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #f5f0e8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 6px;
      margin-bottom: 25px;
      color: #aaa;
      font-size: 14px;
      letter-spacing: 1px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    #status {
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #222;
      font-size: 20px;
      font-weight: bold;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #details {
      margin-top: 12px;
      font-size: 17px;
      line-height: 1.6;
      color: #ddd;
    }

    button {
      margin-top: 22px;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #f28c28;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none;
    }

    .valid {
      background: #164d2a !important;
      color: #7dff9e;
    }

    .used {
      background: #541b1b !important;
      color: #ff7777;
    }

    .invalid {
      background: #4b3b16 !important;
      color: #ffd36b;
    }

    .error {
      background: #541b1b !important;
      color: #ff7777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SAMARAM '26</h1>
  <div class="subtitle">ENTRY VERIFICATION</div>

  <div id="reader"></div>

  <div id="status">
    Scan a pass
  </div>

  <div id="details"></div>

  <button id="scanAgain" class="hidden" onclick="startScanner()">
    SCAN NEXT PASS
  </button>

</div>


<script>

  // =========================================================
  // APPS SCRIPT BACKEND
  // =========================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbz8Kw4J5VjVtzSyWPr5LdzMobzdncJ_7u5h50QGv8Y3VfLA46I0rviNzqy0XcFcVsyU/exec";


  // =========================================================
  // SCANNER
  // =========================================================

  let scanner = null;
  let scanning = false;


  function setStatus(message, type = "") {

    const status = document.getElementById("status");

    status.className = "";

    if (type) {
      status.classList.add(type);
    }

    status.textContent = message;
  }


  function startScanner() {

    const status = document.getElementById("status");
    const details = document.getElementById("details");
    const button = document.getElementById("scanAgain");

    details.innerHTML = "";
    button.classList.add("hidden");

    setStatus("Starting camera...");

    if (scanner) {
      try {
        scanner.clear();
      } catch (e) {}
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      function(decodedText) {

        if (scanning) return;

        scanning = true;

        verifyQRCode(decodedText);

      },

      function(errorMessage) {
        // Ignore normal scanning errors
      }

    ).then(function() {

      setStatus("Scan a pass");
      scanning = false;

    }).catch(function(error) {

      console.error(error);

      setStatus(
        "CAMERA ERROR",
        "error"
      );

      details.innerHTML =
        "Please allow camera access and reload the page.";

      button.classList.remove("hidden");

      scanning = false;

    });
  }


  // =========================================================
  // VERIFY QR
  // =========================================================

  function verifyQRCode(decodedText) {

    setStatus("Checking pass...");

    const details = document.getElementById("details");

    details.innerHTML = "";

    const passID = decodedText.trim();

    console.log("Scanned:", passID);


    // Stop camera while checking

    if (scanner) {

      scanner.stop().catch(function() {});

    }


    // =======================================================
    // JSONP CALLBACK
    // =======================================================

    const callbackName =
      "samaramCallback_" + Date.now();


    window[callbackName] = function(result) {

      console.log("Backend result:", result);

      handleVerificationResult(result);

      // Remove callback

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

    };


    const script =
      document.createElement("script");


    script.src =
      API_URL +
      "?passID=" +
      encodeURIComponent(passID) +
      "&callback=" +
      encodeURIComponent(callbackName);


    script.onerror = function() {

      console.error(
        "Could not contact backend"
      );

      setStatus(
        "SYSTEM ERROR",
        "error"
      );

      details.innerHTML =
        "Could not contact the ticket database.";

      document
        .getElementById("scanAgain")
        .classList.remove("hidden");


      try {
        delete window[callbackName];
      } catch (e) {}

    };


    document.body.appendChild(script);

  }


  // =========================================================
  // HANDLE RESULT
  // =========================================================

  function handleVerificationResult(result) {

    const details =
      document.getElementById("details");

    const button =
      document.getElementById("scanAgain");


    // -------------------------------------------------------
    // VALID
    // -------------------------------------------------------

    if (
      result &&
      result.status === "VALID"
    ) {

      setStatus(
        "✓ ENTRY ALLOWED",
        "valid"
      );


      details.innerHTML =
        "<strong>Name:</strong> " +
        escapeHtml(result.name || "Unknown") +
        "<br>" +
        "<strong>Roll No:</strong> " +
        escapeHtml(result.rollNumber || "Unknown");


      button.classList.remove("hidden");

      return;
    }


    // -------------------------------------------------------
    // ALREADY USED
    // -------------------------------------------------------

    if (
      result &&
      result.status === "USED"
    ) {

      setStatus(
        "✕ ALREADY USED",
        "used"
      );


      details.innerHTML =
        escapeHtml(
          result.message ||
          "This pass has already been used."
        );


      button.classList.remove("hidden");

      return;
    }


    // -------------------------------------------------------
    // INVALID
    // -------------------------------------------------------

    setStatus(
      "✕ INVALID PASS",
      "invalid"
    );


    details.innerHTML =
      escapeHtml(
        result && result.message
          ? result.message
          : "This pass is not valid."
      );


    button.classList.remove("hidden");

  }


  // =========================================================
  // SECURITY — ESCAPE HTML
  // =========================================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // =========================================================
  // START AUTOMATICALLY
  // =========================================================

  window.onload = function() {

    startScanner();

  };

</script>

</body>
</html>
